[build]
  publish = ".next"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"


[functions]
  node_bundler = "esbuild"
  external_node_modules = ["styled-jsx", "request", "request-promise"]
  included_files = [
    "node_modules/styled-jsx/**",
    "node_modules/request/**",
    "node_modules/request-promise/**"
  ]

  